name: Validate Mozilla AI Registry

on:
  pull_request:
    paths:
      - 'internal/provider/mozilla_ai/data/registry.json'
      - 'internal/provider/mozilla_ai/data/schema.json'
      - '.github/workflows/validate-registry.yaml'
  push:
    branches:
      - main
    paths:
      - 'internal/provider/mozilla_ai/data/registry.json'
      - 'internal/provider/mozilla_ai/data/schema.json'
      - '.github/workflows/validate-registry.yaml'
  workflow_dispatch:

jobs:
  validate:
    name: Validate Registry JSON Schema
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Set up Go (from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Validate registry.json against schema
        run: make validate-registry
      
      - name: Success message
        if: success()
        run: echo "✅ Registry validation passed!"