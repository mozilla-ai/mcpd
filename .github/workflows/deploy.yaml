name: Deploy mcpd

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      version:
        description: 'Version tag (e.g. v0.2.1)'
        required: true
        type: string
      runtime_file:
        description: 'Portable execution context file (from mcpd config export)'
        required: false
        default: 'secrets.prod.toml'
        type: string

# Inputs reach the shell through the environment. An input interpolated into a
# run body is substituted before the shell parses it, so a crafted value would
# run as code with the deployment secrets in scope.
env:
  DEPLOY_ENV: ${{ inputs.environment }}
  RUNTIME_FILE: ${{ inputs.runtime_file }}
  VERSION: ${{ inputs.version }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets resolve from the selected environment, whose deployment policy
    # limits the refs that can read them.
    environment: ${{ inputs.environment }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Stage the secret resolver
        # The tag's tree replaces this one below, so the resolver comes from the
        # ref that triggered the run rather than from the tag being deployed.
        run: cp scripts/resolve-secrets.sh "$RUNNER_TEMP/resolve-secrets.sh"

      - name: Checkout release tag
        run: |
          git fetch --tags --force
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error ::Version '$VERSION' does not match expected pattern vX.Y.Z"
            exit 1
          fi
          if ! git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "::error ::Tag '$VERSION' does not exist in repository"
            exit 1
          fi
          echo "Checking out tag $VERSION"
          git checkout "$VERSION"

      - name: Validate configuration files
        run: |
          if [[ ! -f ".mcpd.toml" ]]; then
            echo "::error ::Missing .mcpd.toml - ensure project configuration is committed"
            exit 1
          fi
          if [[ ! -f "$RUNTIME_FILE" ]]; then
            echo "::error ::Missing $RUNTIME_FILE - run 'mcpd config export' locally and commit the file"
            exit 1
          fi
          echo "Configuration files validated"

      - name: Install mcpd
        run: |
          ARCH="$(uname -m)"
          curl -fsSL "https://github.com/mozilla-ai/mcpd/releases/download/${VERSION}/mcpd_Linux_${ARCH}.tar.gz" \
            | tar xz -C /usr/local/bin
          chmod +x /usr/local/bin/mcpd
          echo "Installed mcpd ${VERSION} (${ARCH})"

      - name: Generate environment contract (.env)
        run: mcpd config export --runtime-file="$RUNTIME_FILE" --contract-output=.env

      - name: Resolve GitHub secrets required for mcpd
        run: |
          "$RUNNER_TEMP/resolve-secrets.sh" .env .env.resolved
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}

      - name: Deploy mcpd (example)
        run: |
          echo "Deploying $VERSION to $DEPLOY_ENV..."
          # docker run -d \
          #   -p 8090:8090 \
          #   -v $PWD/.mcpd.toml:/etc/mcpd/.mcpd.toml:ro \
          #   -v $PWD/$RUNTIME_FILE:/home/mcpd/.config/mcpd/secrets.prod.toml:ro \
          #   --env-file .env.resolved \
          #   mzdotai/mcpd:$VERSION
