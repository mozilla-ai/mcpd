name: Release

# Both triggers run on the tag being released. A published Release has a
# GITHUB_REF of refs/tags/<tag_name>, and a dispatch has to target the tag, so
# the release environment's deployment policy gates the ref GoReleaser builds.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      skip_publish:
        description: "Skip binary publish"
        required: false
        default: "false"
      skip_docker:
        description: "Skip docker publish"
        required: false
        default: "false"
      skip_homebrew:
        description: "Skip homebrew publish"
        required: false
        default: "false"
      skip_validate:
        description: "Skip GoReleaser validation"
        required: false
        default: "false"

permissions:
  contents: write
  # Docker Hub trusts this repository's release environment through an OIDC
  # connection, and the login exchanges this token for a registry one.
  id-token: write

jobs:
  goreleaser:
    # Only product releases (semver v*); docs/v* is handled by the Documentation workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    # Docker Hub's OIDC connection trusts this environment by name, and the
    # tap App key is an environment secret, so the deployment policy limits the
    # refs that can publish.
    environment: release
    steps:
      - name: Validate tag
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          # A branch can carry the same name as a release tag, and the pattern
          # below cannot tell the two apart.
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Ref '$TAG' is a $REF_TYPE; a release runs on a tag"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' does not match expected pattern vX.Y.Z"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Setup QEMU, buildx and login to DockerHub, required for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # No password input: the action takes the OIDC path only when one is
      # absent, and a stored credential left beside it would win silently.
      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}
          # The default lifetime is 300 seconds, which a two-platform build
          # outruns. 3600 is this version's maximum.
          DOCKERHUB_OIDC_EXPIREIN: "3600"
        with:
          username: mzdotai

      # Minted here rather than earlier because the token lasts an hour and
      # GoReleaser pushes the cask at the end of its run.
      - name: Generate tap token
        id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.TAP_APP_PRIVATE_KEY }}
          owner: mozilla-ai
          repositories: homebrew-tap
          permission-contents: write

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: latest
          args: >
            release --clean
            ${{ github.event.inputs.skip_publish == 'true' && ' --skip publish' || '' }}
            ${{ github.event.inputs.skip_validate == 'true' && ' --skip validate' || '' }}
            ${{ github.event.inputs.skip_docker == 'true' && ' --skip docker' || '' }}
            ${{ github.event.inputs.skip_homebrew == 'true' && ' --skip homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ steps.tap-token.outputs.token }}