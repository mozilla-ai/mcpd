name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.0.1)"
        required: true
      skip_publish:
        description: "Skip binary publish"
        required: false
        default: "false"
      skip_docker:
        description: "Skip docker publish"
        required: false
        default: "false"
      skip_homebrew:
        description: "Skip homebrew publish"
        required: false
        default: "false"
      skip_validate:
        description: "Skip GoReleaser validation"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  goreleaser:
    # Only product releases (semver v*); docs/v* is handled by the Documentation workflow.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'release' && startsWith(github.event.release.tag_name, 'v'))
    runs-on: ubuntu-latest
    steps:
      - name: Validate tag
        id: tag
        env:
          TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
        run: |
          if [[ -z "$TAG" ]]; then
            echo "::error::No tag provided"
            exit 1
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Tag '$TAG' does not match expected pattern vX.Y.Z"
            exit 1
          fi

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - name: Set up Go (from go.mod)
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Setup QEMU, buildx and login to DockerHub, required for GoReleaser
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to DockerHub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: latest
          args: >
            release --clean
            ${{ github.event.inputs.skip_publish == 'true' && ' --skip publish' || '' }}
            ${{ github.event.inputs.skip_validate == 'true' && ' --skip validate' || '' }}
            ${{ github.event.inputs.skip_docker == 'true' && ' --skip docker' || '' }}
            ${{ github.event.inputs.skip_homebrew == 'true' && ' --skip homebrew' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}